name: Build & Release

# Building a release:
#   1. Update the version in engine/version.py and CHANGELOG.md
#   2. Commit and tag:  git tag v1.0.1 && git push origin v1.0.1
#   3. This workflow builds the portable Windows bundle and attaches it
#      to a GitHub Release automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build portable Windows bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6,<7"

      - name: Build with PyInstaller
        run: python -m PyInstaller installer/DLite.spec --noconfirm

      - name: Zip portable bundle
        shell: powershell
        run: Compress-Archive -Path dist/DLite -DestinationPath DLite-portable-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: DLite-portable-windows-x64.zip
          generate_release_notes: true
